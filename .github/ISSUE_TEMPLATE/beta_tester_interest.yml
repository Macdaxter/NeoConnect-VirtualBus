name: Beta tester interest
description: Describe a VirtualBus hardware path you can test
title: "[Tester interest] "
labels: ["beta", "tester-interest"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public request. Do not include email addresses, credentials,
        ROM/BIOS details, private IP addresses or other personal information.
        Package access is limited to selected testers and is not provided
        through a public issue attachment.
  - type: checkboxes
    id: hardware
    attributes:
      label: Available hardware
      description: Select every endpoint you can physically test.
      options:
        - label: Windows x64 PC with MAME
        - label: MiSTer FPGA with network/SSH access
        - label: ESP8266 NodeMCU adapter
        - label: ESP32 adapter
        - label: MAX485/RS485 hardware
  - type: dropdown
    id: topology
    attributes:
      label: Primary topology
      options:
        - MAME to MAME
        - MAME to MiSTer
        - Multi-cabinet MCU profile
        - InputSync profile
        - ESP/transport diagnostics
        - Portable USB installation only
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Describe cabinet count, endpoint types and connection method without private addresses.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Relevant experience
      description: Briefly describe experience with MAME, MiSTer, ESP flashing or arcade hardware.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Test conditions
      options:
        - label: I can verify SHA256 checksums and keep all components on one release version.
          required: true
        - label: I can provide redacted logs and reproducible steps for failures.
          required: true
        - label: I understand that ROMs, BIOS files and CHDs are never provided.
          required: true
